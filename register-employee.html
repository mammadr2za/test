<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ثبت حساب کارمند | فولاد من</title><link rel="stylesheet" href="assets/styles.css"></head>
<body data-page="register">
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-visual">
        <h2>تعریف حساب کارمند</h2>
        <p>برای اپراتورها، مدیر فروش، و تیم قیمت‌گذاری کارخانه.</p>
      </div>
      <div class="auth-form">
        <h3>فرم ساخت حساب کارمند</h3>
        <form id="registerForm" class="grid">
          <input type="hidden" name="role" value="employee">
          <div class="field"><label>نام و نام خانوادگی</label><input name="name" required></div>
          <div class="field"><label>موبایل</label><input name="phone" required></div>
          <div class="field"><label>رمز عبور</label><input name="password" type="password" required></div>
          <button class="btn" type="submit">ایجاد حساب کارمند</button>
        </form>
        <a class="btn" href="login.html">بازگشت به ورود</a>
        <div id="toast" class="note">پس از ثبت، با همین شماره/رمز در صفحه ورود لاگین کنید.</div>
      </div>
    </div>
  </div>
<script src="assets/app.js"></script>
</body>
</html>
